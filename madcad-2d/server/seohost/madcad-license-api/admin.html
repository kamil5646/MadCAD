<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'">
  <title>MadCAD — licencje</title>
  <link rel="icon" href="madcad-512.png">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main>
    <header><div class="admin-brand"><img src="madcad-512.png" alt="" width="52" height="52"><div><small>MADCAD · ADMINISTRACJA</small><h1>Konta i licencje</h1><p>Plan komercyjny nadaje serwer. Sekret pozostaje tylko w pamięci tej karty.</p></div></div><button id="refreshBtn" type="button">Odśwież</button></header>
    <section class="auth" aria-label="Uwierzytelnienie administratora"><label><span>Sekret administratora</span><input id="adminToken" type="password" minlength="32" autocomplete="off" spellcheck="false"></label><button id="connectBtn" type="button">Połącz</button></section>
    <p id="status" role="status" aria-live="polite">Podaj sekret utworzony poza public_html.</p>
    <section id="users" class="users" aria-label="Konta MadCAD"></section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
