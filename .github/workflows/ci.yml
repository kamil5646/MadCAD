name: MadCAD CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code quality and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: madcad-2d
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: madcad-2d/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Lint source
        run: npm run lint
      - name: Run unit tests
        run: npm test
      - name: Run license client tests
        run: npm run test:license
      - name: Run native import file tests
        run: npm run test:import-file
      - name: Run solid FEA benchmark gate
        run: npm run verify:solid-fea-benchmarks
      - name: Verify repository, website and licensing metadata
        run: npm run verify:repository
      - name: Verify product completeness manifest
        run: npm run verify:product-completeness
      - name: Audit production and build dependencies
        run: npm audit --audit-level=high

  core:
    name: Core tests and UI build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: madcad-2d
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: madcad-2d/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Run CAD core tests with coverage gate
        if: runner.os == 'Linux'
        run: npm run test:core:coverage
      - name: Run CAD core tests
        if: runner.os != 'Linux'
        run: npm run test:core
      - name: Build desktop renderer
        run: npm run build:ui

  desktop-e2e:
    name: Desktop E2E ${{ matrix.shard }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [quality, core]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        shard: [modeling, interoperability, interface, project, analysis]
    defaults:
      run:
        working-directory: madcad-2d
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: madcad-2d/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Run complete Electron verification shard
        run: npm run verify:desktop-suite -- ${{ matrix.shard }}
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-verification-${{ matrix.os }}-${{ matrix.shard }}
          path: madcad-2d/artifacts/
          if-no-files-found: warn

  installer-smoke:
    name: Installer smoke (${{ matrix.kind }})
    runs-on: ${{ matrix.os }}
    needs: desktop-e2e
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            kind: mac
            build: npm run dist:mac:unsigned
          - os: macos-latest
            kind: mac-dmg
            build: npm run dist:mac:dmg
          - os: windows-latest
            kind: windows
            build: npm run dist:win:unsigned
          - os: windows-latest
            kind: windows-portable
            build: npm run dist:win:portable
          - os: ubuntu-latest
            kind: linux
            build: npm run dist:linux:trusted
    defaults:
      run:
        working-directory: madcad-2d
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: madcad-2d/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Build installer
        run: ${{ matrix.build }}
      - name: Verify package signature and size
        run: npm run verify:package -- ${{ matrix.kind }}
      - name: Generate and verify package checksum
        shell: bash
        run: npm run checksums:package && MADCAD_REQUIRE_CHECKSUM=1 npm run verify:package -- ${{ matrix.kind }}
      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: MadCAD-${{ matrix.kind }}
          path: madcad-2d/release/MadCAD-*
          if-no-files-found: error
