name: MadCAD CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code quality and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: madcad-2d
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: madcad-2d/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Lint source
        run: npm run lint
      - name: Run unit tests
        run: npm test
      - name: Audit production and build dependencies
        run: npm audit --audit-level=high

  core:
    name: Core tests and UI build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: madcad-2d
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: madcad-2d/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Run CAD core tests
        run: npm run test:core
      - name: Build desktop renderer
        run: npm run build:ui

  desktop-e2e:
    name: Desktop modeling E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [quality, core]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        working-directory: madcad-2d
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: madcad-2d/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Run Electron modeling verification
        run: npm run verify:modeling
      - name: Verify Electron sandbox and IPC boundary
        run: npm run verify:electron-security
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: modeling-verification-${{ matrix.os }}
          path: madcad-2d/artifacts/
          if-no-files-found: warn

  installer-smoke:
    name: Installer smoke (${{ matrix.kind }})
    runs-on: ${{ matrix.os }}
    needs: desktop-e2e
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            kind: mac
            build: npm run dist:mac:trusted
          - os: windows-latest
            kind: windows
            build: npm run dist:win:trusted
    defaults:
      run:
        working-directory: madcad-2d
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: madcad-2d/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Build installer
        run: ${{ matrix.build }}
      - name: Verify package signature and size
        run: npm run verify:package -- ${{ matrix.kind }}
      - name: Generate and verify package checksum
        shell: bash
        run: npm run checksums:package && MADCAD_REQUIRE_CHECKSUM=1 npm run verify:package -- ${{ matrix.kind }}
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: MadCAD-${{ matrix.kind }}
          path: madcad-2d/release/MadCAD-*
          if-no-files-found: error
