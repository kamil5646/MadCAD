# MadCAD 8 for Windows x64: an installer, a portable MadCAD.exe and a zip with the CLI and licences.
# Runs on every push to the madcad8 branch; the release takes the files from the run's artifact.
name: MadCAD Windows

on:
  push:
    branches: [madcad8]
  workflow_dispatch:

permissions:
  contents: read

# Faster than the Mac release build: no LTO and no debug info (no PDBs to write). The cache keeps
# the dependencies, so a later run rebuilds only MadCAD's own crates.
env:
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: madcad-windows-x64
          cache-on-failure: true
      - name: Build
        run: cargo build --locked --release -p solidcraft -p solidcraft-cli --target x86_64-pc-windows-msvc
      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $bin = "target/x86_64-pc-windows-msvc/release"
          & "$bin/solidcraft-cli.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $name = "MadCAD-$version-windows-x64"
          $stage = "target/madcad-windows/$name"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "$bin/solidcraft.exe" "$stage/MadCAD.exe"
          Copy-Item "$bin/solidcraft-cli.exe" "$stage/solidcraft-cli.exe"
          foreach ($f in 'LICENSE-MIT', 'LICENSE-APACHE', 'NOTICE', 'THIRD-PARTY-LICENSES.txt', 'ATTRIBUTION.md') { Copy-Item $f $stage }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $stage -DestinationPath "dist/$name.zip"
          Copy-Item "$bin/solidcraft.exe" "dist/$name.exe"
          Copy-Item assets/icons/app/madcad/madcad.ico "$stage/MadCAD.ico"
          "version=$version" >> $env:GITHUB_OUTPUT
          "stage=$((Resolve-Path $stage).Path)" >> $env:GITHUB_OUTPUT
      - name: Benchmark
        shell: pwsh
        run: |
          # Kernel times of a block with fillets and cuts (and two corpus scripts), to compare with the Mac build.
          $cli = "target/x86_64-pc-windows-msvc/release/solidcraft-cli.exe"
          foreach ($s in 'packaging/madcad/bench-cut.json', 'examples/bracket.json', 'apps/solidcraft-cli/tests/corpus/scripts/m0-revolve-primitives.json') {
            $r = & $cli run $s --timings --quiet | ConvertFrom-Json
            "{0}: {1:N1} ms" -f $s, $r.total_ms
            $r.timings | Where-Object { $_.ms -gt 1 } | ForEach-Object { "  {0,8:N1} {1}" -f $_.ms, $_.command }
          }
      - name: Function checks
        shell: pwsh
        run: |
          # The engine's checks (packaging/madcad/qa): bodies, volumes and errors of 135 cases.
          $env:MADCAD_CLI = (Resolve-Path "target/x86_64-pc-windows-msvc/release/solidcraft-cli.exe").Path
          Set-Location packaging/madcad/qa
          $failed = $false
          foreach ($t in 't_solid.py', 't_sketch.py', 't_hist.py') {
            python $t | Where-Object { $_ -notmatch '^OK' }
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Interface checks
        shell: pwsh
        continue-on-error: true
        run: |
          # The window worked by clicks and keys (packaging/madcad/qa/ui).
          python packaging/madcad/qa/ui/test_ui.py "${{ steps.package.outputs.stage }}\MadCAD.exe"
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DVersion=${{ steps.package.outputs.version }}" "/DStage=${{ steps.package.outputs.stage }}" "/DOut=$((Resolve-Path dist).Path)" packaging/madcad/madcad.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: madcad-windows-x64
          path: dist/*
          if-no-files-found: error
