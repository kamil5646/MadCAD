# MadCAD 8 for Windows x64: a portable MadCAD.exe and a zip with the CLI and licences.
# Runs on every push to the madcad8 branch; the release takes the files from the run's artifact.
name: MadCAD Windows

on:
  push:
    branches: [madcad8]
  workflow_dispatch:

permissions:
  contents: read

# Faster than the Mac release build: no LTO and no debug info (no PDBs to write). The cache keeps
# the dependencies, so a later run rebuilds only MadCAD's own crates.
env:
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: madcad-windows-x64
          cache-on-failure: true
      - name: Build
        run: cargo build --locked --release -p solidcraft -p solidcraft-cli --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $bin = "target/x86_64-pc-windows-msvc/release"
          & "$bin/solidcraft-cli.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $name = "MadCAD-$version-windows-x64"
          $stage = "target/madcad-windows/$name"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "$bin/solidcraft.exe" "$stage/MadCAD.exe"
          Copy-Item "$bin/solidcraft-cli.exe" "$stage/solidcraft-cli.exe"
          foreach ($f in 'LICENSE-MIT', 'LICENSE-APACHE', 'NOTICE', 'THIRD-PARTY-LICENSES.txt', 'ATTRIBUTION.md') { Copy-Item $f $stage }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $stage -DestinationPath "dist/$name.zip"
          Copy-Item "$bin/solidcraft.exe" "dist/$name.exe"
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: madcad-windows-x64
          path: dist/*
          if-no-files-found: error
