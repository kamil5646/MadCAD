name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  quality:
    name: Quality Gate (tests & build)
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: madcad-2d/package-lock.json

      - name: Install app dependencies
        working-directory: madcad-2d
        run: npm ci

      - name: Run CAD core tests
        working-directory: madcad-2d
        run: npm run test:core

      - name: Build UI
        working-directory: madcad-2d
        run: npm run build:ui

      - name: Install worker dependencies
        working-directory: cloudflare/license-registry-worker
        run: npm ci

      - name: Test worker
        working-directory: cloudflare/license-registry-worker
        run: npm test

  release:
    name: Signed build on ${{ matrix.os }}
    needs: quality
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: madcad-2d/package-lock.json

      - name: Install Dependencies
        working-directory: madcad-2d
        run: npm ci

      - name: Build UI
        working-directory: madcad-2d
        run: npm run build:ui

      - name: Run CAD core tests
        working-directory: madcad-2d
        run: npm run test:core

      - name: Build signed Electron package
        working-directory: madcad-2d
        shell: bash
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${CSC_LINK:-}" ]; then
            echo "No signing certificate configured; building unsigned artifacts."
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder --publish never

      - name: Create SHA-256 sidecars
        working-directory: madcad-2d
        run: npm run checksums:package

      - name: Verify signature, format and SHA-256
        working-directory: madcad-2d
        env:
          MADCAD_REQUIRE_CHECKSUM: '1'
          MADCAD_REQUIRE_SIGNATURE: '0'
        run: npm run verify:package -- ${{ runner.os == 'macOS' && 'mac' || 'windows' }}

      - name: Upload signed release package
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            madcad-2d/release/MadCAD-*.zip
            madcad-2d/release/MadCAD-*.exe
            madcad-2d/release/MadCAD-*.sha256
          if-no-files-found: error

  publish:
    name: Publish immutable GitHub release
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@v4.1.3
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish release channel
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/MadCAD-*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-alpha.') || contains(github.ref_name, '-beta.') }}
          generate_release_notes: true
