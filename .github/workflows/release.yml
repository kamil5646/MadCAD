name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: madcad-2d/package-lock.json

      - name: Install Dependencies
        working-directory: madcad-2d
        run: npm ci

      - name: Build UI
        working-directory: madcad-2d
        run: npm run build:ui

      - name: Run CAD core tests
        working-directory: madcad-2d
        run: npm run test:core

      - name: Build and Publish Electron
        working-directory: madcad-2d
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish always

      - name: Verify published package locally
        working-directory: madcad-2d
        run: npm run verify:package -- ${{ runner.os == 'macOS' && 'mac' || 'windows' }}
