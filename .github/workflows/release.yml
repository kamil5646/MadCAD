name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality Gate (tests & build)
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify tag belongs to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: madcad-2d/package-lock.json

      - name: Install app dependencies
        working-directory: madcad-2d
        run: npm ci

      - name: Verify tag matches package version
        working-directory: madcad-2d
        run: npm run verify:release-version -- "$GITHUB_REF_NAME"

      - name: Verify repository, website and licensing metadata
        working-directory: madcad-2d
        run: npm run verify:repository

      - name: Lint source
        working-directory: madcad-2d
        run: npm run lint

      - name: Run unit tests
        working-directory: madcad-2d
        run: npm test

      - name: Audit app dependencies
        working-directory: madcad-2d
        run: npm audit --audit-level=high

      - name: Run CAD core tests
        working-directory: madcad-2d
        run: npm run test:core

      - name: Build UI
        working-directory: madcad-2d
        run: npm run build:ui

  release:
    name: Verified release build on ${{ matrix.os }}
    needs: quality
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: madcad-2d/package-lock.json

      - name: Install Dependencies
        working-directory: madcad-2d
        run: npm ci

      - name: Build UI
        working-directory: madcad-2d
        run: npm run build:ui

      - name: Run CAD core tests
        working-directory: madcad-2d
        run: npm run test:core

      - name: Run Electron modeling verification
        working-directory: madcad-2d
        run: npm run verify:modeling

      - name: Verify Electron sandbox and IPC boundary
        working-directory: madcad-2d
        run: npm run verify:electron-security

      - name: Build Electron package
        working-directory: madcad-2d
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          echo "Building unsigned packages by repository-owner decision; SHA-256 and platform tests remain mandatory."
          if [ "$RUNNER_OS" = "macOS" ]; then
            npx electron-builder --mac zip --arm64 --publish never
          else
            npx electron-builder --win nsis --x64 --publish never
          fi

      - name: Create SHA-256 sidecars
        working-directory: madcad-2d
        run: npm run checksums:package

      - name: Verify package format and checksum
        working-directory: madcad-2d
        env:
          MADCAD_REQUIRE_CHECKSUM: '1'
          MADCAD_REQUIRE_SIGNATURE: '0'
        run: npm run verify:package -- ${{ runner.os == 'macOS' && 'mac' || 'windows' }}

      - name: Upload verified release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ runner.os }}
          path: |
            madcad-2d/release/MadCAD-*.zip
            madcad-2d/release/MadCAD-*.exe
            madcad-2d/release/MadCAD-*.sha256
          if-no-files-found: error

  publish:
    name: Publish immutable GitHub release
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish release channel
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          files: release-assets/MadCAD-*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-alpha.') || contains(github.ref_name, '-beta.') }}
          generate_release_notes: true
          body: |
            ## Ważne — wydanie bez podpisu producenta

            Paczki Windows i macOS nie mają podpisu Authenticode ani Apple Developer ID/notaryzacji. Windows SmartScreen lub macOS Gatekeeper mogą wyświetlić ostrzeżenie.

            Wbudowany aktualizator pobiera paczkę wyłącznie z oficjalnego wydania, sprawdza odpowiadającą sumę SHA-256 i otwiera plik do instalacji systemowej. Bez certyfikatu platformowego system nadal wymaga ręcznego potwierdzenia i może wyświetlić ostrzeżenie.
