name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality Gate (tests & build)
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag belongs to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: madcad-2d/package-lock.json

      - name: Install app dependencies
        working-directory: madcad-2d
        run: npm ci

      - name: Verify tag matches package version
        working-directory: madcad-2d
        run: npm run verify:release-version -- "$GITHUB_REF_NAME"

      - name: Lint source
        working-directory: madcad-2d
        run: npm run lint

      - name: Run unit tests
        working-directory: madcad-2d
        run: npm test

      - name: Audit app dependencies
        working-directory: madcad-2d
        run: npm audit --audit-level=high

      - name: Run CAD core tests
        working-directory: madcad-2d
        run: npm run test:core

      - name: Build UI
        working-directory: madcad-2d
        run: npm run build:ui

      - name: Install worker dependencies
        working-directory: cloudflare/license-registry-worker
        run: npm ci

      - name: Audit worker dependencies
        working-directory: cloudflare/license-registry-worker
        run: npm audit --audit-level=high

      - name: Test worker
        working-directory: cloudflare/license-registry-worker
        run: npm test

  release:
    name: Verified release build on ${{ matrix.os }}
    needs: quality
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: madcad-2d/package-lock.json

      - name: Install Dependencies
        working-directory: madcad-2d
        run: npm ci

      - name: Build UI
        working-directory: madcad-2d
        run: npm run build:ui

      - name: Run CAD core tests
        working-directory: madcad-2d
        run: npm run test:core

      - name: Run Electron modeling verification
        working-directory: madcad-2d
        run: npm run verify:modeling

      - name: Verify Electron sandbox and IPC boundary
        working-directory: madcad-2d
        run: npm run verify:electron-security

      - name: Build Electron package
        working-directory: madcad-2d
        shell: bash
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${CSC_LINK:-}" ]; then
            echo "No signing certificate configured; building unsigned artifacts."
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder --publish never

      - name: Create SHA-256 sidecars
        working-directory: madcad-2d
        run: npm run checksums:package

      - name: Verify package format, checksum and configured signature
        working-directory: madcad-2d
        env:
          MADCAD_REQUIRE_CHECKSUM: '1'
          MADCAD_REQUIRE_SIGNATURE: ${{ ((runner.os == 'macOS' && secrets.MAC_CSC_LINK != '') || (runner.os == 'Windows' && secrets.WIN_CSC_LINK != '')) && '1' || '0' }}
        run: npm run verify:package -- ${{ runner.os == 'macOS' && 'mac' || 'windows' }}

      - name: Upload verified release package
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ runner.os }}
          path: |
            madcad-2d/release/MadCAD-*.zip
            madcad-2d/release/MadCAD-*.exe
            madcad-2d/release/MadCAD-*.sha256
          if-no-files-found: error

  publish:
    name: Publish immutable GitHub release
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish release channel
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/MadCAD-*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-alpha.') || contains(github.ref_name, '-beta.') }}
          generate_release_notes: true
